name: CI

# OCLoop runs where OpenCode runs: macOS, Windows and Linux. The three gates
# below are the ones AGENTS.md defines for a change to be considered done
# (typecheck, tests, production build) — and they are exactly the three that
# caught the Windows-only breakage found during the cross-platform audit
# (URL-based paths, POSIX-only test binaries).
#
# The build runs BEFORE the tests on purpose: the CLI test suite spawns the
# compiled entrypoint (dist/index.js), so a test run without a build would
# fail for the wrong reason.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only checks out and reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels a stale PR/branch run, but never a main run: every
  # commit on main keeps its own green/red signal.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Local suite + build take well under a minute; the slowest runner
    # (Windows) a few. A hung child or runner must not burn the 360m default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pinned image: macos-latest runners died at 15m in consecutive runs.
        os: [macos-15, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the 1.3 line (local dev uses 1.3.8): a new Bun minor must
          # not break main without a change in this repo. Bump deliberately.
          bun-version: 1.3.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

  # The unit tests mock the OpenCode launcher, so they cannot prove that the
  # real binary spawns and answers on each OS — the most platform-sensitive
  # path in the project (PATHEXT on Windows, the .cmd shell shim, the ready
  # marker, the teardown). This job runs the actual binary everywhere.
  server-smoke:
    name: server smoke (${{ matrix.os }}, ${{ matrix.opencode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pinned image: macos-latest runners died at 15m in consecutive runs.
        os: [macos-15, windows-latest, ubuntu-latest]
        # v1 has no server password (v1 ready-marker path); latest is v2 (Basic auth).
        # `@latest` floats ON PURPOSE: it tracks the current v2 line users
        # install, so an upstream break shows up here before it reaches them.
        opencode: ["opencode-ai@^1", "opencode-ai@latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the 1.3 line (local dev uses 1.3.8): a new Bun minor must
          # not break main without a change in this repo. Bump deliberately.
          bun-version: 1.3.x

      - name: Install the real OpenCode binary
        shell: bash
        env:
          OCOPENCODE_PKG: ${{ matrix.opencode }}
        run: npm install -g "$OCOPENCODE_PKG"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: "Smoke: start the real server, answer a request, tear it down"
        run: bun run scripts/smoke-server.ts
